name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches production (Postgres 17 on the lvivhp host), so the
        # migrations are exercised against the same major version.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cutest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version production runs. The code needs 3.12+ regardless.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # TEST_DATABASE_URL un-skips the database integration tests, which
        # cover the registration race and the merge-upsert semantics.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/cutest
        run: pytest -q

      - name: Migrations round-trip
        # upgrade is already covered by init_db() in the test fixtures; this
        # asserts downgrade works and that the model matches the schema.
        env:
          BOT_TOKEN: "ci:token"
          ADMIN_IDS: "1"
          GOOGLE_CREDS_JSON: "{}"
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/cutest
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
